# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.15.14+7165

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2  # For Linux/Desktop support
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5 # plugin for persistent store for simple data (key-value pairs) like settings
  community_charts_flutter: ^1.0.4
  month_picker_dialog: ^6.7.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  flutter_colorpicker: ^1.1.0
  file_picker: ^12.0.0
  uuid: ^4.6.0
  package_info_plus: ^10.2.1
  flutter_displaymode: ^0.7.0
  future_progress_dialog: ^0.2.1
  pointycastle: any
  talker_flutter: ^5.1.20

  font_awesome_flutter: ^11.0.0
  intl: ^0.20.3
  function_tree: ^0.9.1
  flutter_typeahead: ^6.0.0
  file_selector: ^1.1.0
  emoji_picker_flutter: ^4.5.3
  reorderable_grid: ^1.0.13
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  auto_size_text: ^3.0.0
  quick_actions: ^1.1.0
  pdf: ^3.12.0
  home_widget: ^0.9.4
  http: ^1.6.0
  crypto: ^3.0.6
  archive: ^4.0.9
  collection: ^1.19.1
  # Hook for extensions kept outside this repository (see the README).
  private_extensions:
    path: packages/private_extensions
  # Fork: notificação do sync automático (Dinzo e extensões).
  flutter_local_notifications: ^22.2.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.0
  test: ^1.31.1
  mockito: ^5.8.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/banks/
    - assets/images/stocks/
    - assets/images/stocks_us/
    - assets/images/sites/
    - assets/images/crypto/
    - assets/adblock/
    - assets/darkreader/

